apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lostlink-ingress
  namespace: lostlink
  labels:
    app.kubernetes.io/name: lostlink
    app.kubernetes.io/component: ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: lostlink.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lostlink-web
                port:
                  number: 3000
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lostlink-web
                port:
                  number: 3000
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lostlink-web
                port:
                  number: 3000
