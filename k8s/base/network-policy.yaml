apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-network-policy
  namespace: lostlink
  labels:
    app.kubernetes.io/name: lostlink
    app.kubernetes.io/component: security
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    # Allow connections only from web pods, worker pods, migration jobs, and backup jobs on port 5432
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["lostlink-web", "lostlink-worker", "lostlink-db-migrate", "lostlink-backup"]
      ports:
        - protocol: TCP
          port: 5432

