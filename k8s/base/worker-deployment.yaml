apiVersion: apps/v1
kind: Deployment
metadata:
  name: lostlink-worker
  namespace: lostlink
  labels:
    app: lostlink-worker
    tier: background
    app.kubernetes.io/name: lostlink
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lostlink-worker
  template:
    metadata:
      labels:
        app: lostlink-worker
        tier: background
        app.kubernetes.io/name: lostlink
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: lostlink-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command:
            - /bin/sh
            - -c
            - |
              echo "==> Verifying PostgreSQL connectivity on ${PGHOST}:${PGPORT}..."
              until pg_isready -h "${PGHOST}" -p "${PGPORT}"; do
                echo "Worker waiting for postgresql service at ${PGHOST}:${PGPORT}..."
                sleep 2
              done
              echo "==> PostgreSQL port is accepting connections."
              
              echo "==> Verifying database authentication for user '${PGUSER}' on database '${PGDATABASE}' (SSL: ${PGSSLMODE})..."
              until psql -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" -d "${PGDATABASE}" -c "SELECT 1;" >/dev/null 2>&1; do
                echo "Worker awaiting successful database authentication..."
                sleep 2
              done
              echo "==> PostgreSQL authentication verified. Background worker initiating."
          env:
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: lostlink-config
                  key: POSTGRES_HOST
            - name: PGPORT
              valueFrom:
                configMapKeyRef:
                  name: lostlink-config
                  key: POSTGRES_PORT
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: lostlink-secrets
                  key: POSTGRES_USER
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: lostlink-secrets
                  key: POSTGRES_DB
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: lostlink-secrets
                  key: POSTGRES_PASSWORD
            - name: PGSSLMODE
              valueFrom:
                configMapKeyRef:
                  name: lostlink-config
                  key: PGSSLMODE
            - name: PGCONNECT_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: lostlink-config
                  key: PGCONNECT_TIMEOUT
      containers:
        - name: worker
          image: lostlink-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: lostlink-config
            - secretRef:
                name: lostlink-secrets
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
