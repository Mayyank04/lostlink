apiVersion: batch/v1
kind: Job
metadata:
  name: lostlink-db-migrate
  namespace: lostlink
  labels:
    app.kubernetes.io/name: lostlink
    app.kubernetes.io/component: db-migration
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: lostlink-db-migrate
        app.kubernetes.io/name: lostlink
        app.kubernetes.io/component: db-migration
    spec:
      serviceAccountName: lostlink-sa
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - /bin/sh
            - -c
            - |
              echo "==> Verifying PostgreSQL connectivity on ${PGHOST}:${PGPORT}..."
              until pg_isready -h "${PGHOST}" -p "${PGPORT}"; do
                echo "Waiting for PostgreSQL host ${PGHOST}:${PGPORT} to accept connections..."
                sleep 2
              done
              echo "==> PostgreSQL port is accepting connections."
              
              echo "==> Verifying database authentication for user '${PGUSER}' on database '${PGDATABASE}' (SSL: ${PGSSLMODE})..."
              until psql -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" -d "${PGDATABASE}" -c "SELECT 1;" >/dev/null 2>&1; do
                echo "Awaiting successful database authentication..."
                sleep 2
              done
              echo "==> Database authentication verified successfully!"
          env:
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: lostlink-config
                  key: POSTGRES_HOST
            - name: PGPORT
              valueFrom:
                configMapKeyRef:
                  name: lostlink-config
                  key: POSTGRES_PORT
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: lostlink-secrets
                  key: POSTGRES_USER
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: lostlink-secrets
                  key: POSTGRES_DB
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: lostlink-secrets
                  key: POSTGRES_PASSWORD
            - name: PGSSLMODE
              valueFrom:
                configMapKeyRef:
                  name: lostlink-config
                  key: PGSSLMODE
            - name: PGCONNECT_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: lostlink-config
                  key: PGCONNECT_TIMEOUT
      containers:
        - name: prisma-migrate
          image: lostlink-worker:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Applying database schema migrations via Prisma..."
              npx prisma migrate deploy
              echo "Database schema synchronized successfully."
          envFrom:
            - configMapRef:
                name: lostlink-config
            - secretRef:
                name: lostlink-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
