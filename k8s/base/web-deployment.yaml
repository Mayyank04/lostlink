apiVersion: apps/v1
kind: Deployment
metadata:
  name: lostlink-web
  namespace: lostlink
  labels:
    app: lostlink-web
    tier: frontend
    app.kubernetes.io/name: lostlink
    app.kubernetes.io/component: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: lostlink-web
  template:
    metadata:
      labels:
        app: lostlink-web
        tier: frontend
        app.kubernetes.io/name: lostlink
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: lostlink-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command:
            - /bin/sh
            - -c
            - |
              echo "==> Verifying PostgreSQL connectivity on ${PGHOST}:${PGPORT}..."
              until pg_isready -h "${PGHOST}" -p "${PGPORT}"; do
                echo "Waiting for postgresql service at ${PGHOST}:${PGPORT}..."
                sleep 2
              done
              echo "==> PostgreSQL port is accepting connections."
              
              echo "==> Verifying database authentication for user '${PGUSER}' on database '${PGDATABASE}' (SSL: ${PGSSLMODE})..."
              until psql -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" -d "${PGDATABASE}" -c "SELECT 1;" >/dev/null 2>&1; do
                echo "Awaiting successful database authentication..."
                sleep 2
              done
              echo "==> PostgreSQL authentication verified. Web application initiating."
          env:
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: lostlink-config
                  key: POSTGRES_HOST
            - name: PGPORT
              valueFrom:
                configMapKeyRef:
                  name: lostlink-config
                  key: POSTGRES_PORT
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: lostlink-secrets
                  key: POSTGRES_USER
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: lostlink-secrets
                  key: POSTGRES_DB
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: lostlink-secrets
                  key: POSTGRES_PASSWORD
            - name: PGSSLMODE
              valueFrom:
                configMapKeyRef:
                  name: lostlink-config
                  key: PGSSLMODE
            - name: PGCONNECT_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: lostlink-config
                  key: PGCONNECT_TIMEOUT
      containers:
        - name: web
          image: lostlink-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: lostlink-config
            - secretRef:
                name: lostlink-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
