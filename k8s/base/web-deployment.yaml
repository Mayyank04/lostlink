apiVersion: apps/v1
kind: Deployment
metadata:
  name: lostlink-web
  namespace: lostlink
  labels:
    app: lostlink-web
    tier: frontend
    app.kubernetes.io/name: lostlink
    app.kubernetes.io/component: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: lostlink-web
  template:
    metadata:
      labels:
        app: lostlink-web
        tier: frontend
        app.kubernetes.io/name: lostlink
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: lostlink-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U lostlink -d lostlink; do
                echo "Waiting for postgresql service..."
                sleep 2
              done
              echo "PostgreSQL is online and ready for traffic."
      containers:
        - name: web
          image: lostlink-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: lostlink-config
            - secretRef:
                name: lostlink-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
