apiVersion: v1
kind: ConfigMap
metadata:
  name: lostlink-config
  namespace: lostlink
data:
  NODE_ENV: "production"
  PORT: "3000"
  NEXTAUTH_URL: "https://lostlink.example.com"
  NEXT_PUBLIC_APP_URL: "https://lostlink.example.com"
  NEXT_PUBLIC_DEMO_MODE: "false"
  NEXT_TELEMETRY_DISABLED: "1"
  STORAGE_PROVIDER: "s3"
  STORAGE_ENDPOINT: "https://ewr1.vultrobjects.com"
  STORAGE_REGION: "ewr1"
  STORAGE_BUCKET_NAME: "lostlink-uploads"
  STORAGE_FORCE_PATH_STYLE: "true"
  STORAGE_PUBLIC_URL: "https://lostlink-uploads.ewr1.vultrobjects.com"
  OUTBOX_POLL_INTERVAL_MS: "3000"
  WORKER_HEALTH_PORT: "3001"

