apiVersion: batch/v1
kind: Job
metadata:
  name: lostlink-db-migrate
  namespace: lostlink
spec:
  backoffLimit: 3
  template:
    spec:
      containers:
        - name: prisma-migrate
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

