apiVersion: v1
kind: Secret
metadata:
  name: lostlink-secrets
  namespace: lostlink
  labels:
    app.kubernetes.io/name: lostlink
    app.kubernetes.io/component: credentials
type: Opaque
stringData:
  # Database Credentials (Change passwords before applying!)
  POSTGRES_USER: "lostlink_admin"
  POSTGRES_PASSWORD: "CHANGE_ME_SUPER_STRONG_DB_PASSWORD_2026"
  POSTGRES_DB: "lostlink"
  DATABASE_URL: "postgresql://lostlink_admin:CHANGE_ME_SUPER_STRONG_DB_PASSWORD_2026@postgres:5432/lostlink?schema=public"

  # Session & Authentication Signing (Min 32 random characters)
  # Generate via: openssl rand -base64 32
  AUTH_SECRET: "CHANGE_ME_AUTHENTICATION_SECRET_32_CHARACTERS_MINIMUM"
  SESSION_SECRET: "CHANGE_ME_AUTHENTICATION_SECRET_32_CHARACTERS_MINIMUM"
  NEXTAUTH_SECRET: "CHANGE_ME_AUTHENTICATION_SECRET_32_CHARACTERS_MINIMUM"

  # Object Storage (Vultr S3-compatible credentials)
  STORAGE_ACCESS_KEY_ID: "YOUR_VULTR_STORAGE_ACCESS_KEY"
  STORAGE_SECRET_ACCESS_KEY: "YOUR_VULTR_STORAGE_SECRET_KEY"
  S3_ACCESS_KEY_ID: "YOUR_VULTR_STORAGE_ACCESS_KEY"
  S3_SECRET_ACCESS_KEY: "YOUR_VULTR_STORAGE_SECRET_KEY"

  # Hybrid Campus Worker API Key (Optional, for physical campus agents)
  CAMPUS_WORKER_API_KEY: "CHANGE_ME_CAMPUS_WORKER_LEASING_SECRET_KEY"
