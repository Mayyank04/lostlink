apiVersion: apps/v1
kind: Deployment
metadata:
  name: lostlink-web
  namespace: lostlink
spec:
  replicas: 1
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      initContainers:
        - name: wait-for-db
          $patch: delete
      containers:
        - name: web
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lostlink-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 1000m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lostlink-worker
  namespace: lostlink
spec:
  replicas: 1
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      initContainers:
        - name: wait-for-db
          $patch: delete
      containers:
        - name: worker
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lostlink-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi

