apiVersion: batch/v1
kind: CronJob
metadata:
  name: lostlink-postgres-backup
  namespace: lostlink
  labels:
    app.kubernetes.io/name: lostlink-backup
    app.kubernetes.io/component: backup
spec:
  # Run daily at 02:00 AM UTC
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: lostlink-backup
            app.kubernetes.io/name: lostlink-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: postgres-backup
              image: postgres:16-alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_FILE="/backups/lostlink_backup_${TIMESTAMP}.sql.gz"
                  echo "[$(date -u)] Starting automated PostgreSQL backup..."
                  pg_dump -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" | gzip -9 > "$BACKUP_FILE"
                  BACKUP_SIZE=$(ls -lh "$BACKUP_FILE" | awk '{print $5}')
                  echo "[$(date -u)] Backup completed successfully: ${BACKUP_FILE} (Size: ${BACKUP_SIZE})"
                  
                  # Retention policy: Prune local backups older than 7 days
                  find /backups -name "lostlink_backup_*.sql.gz" -mtime +7 -exec rm -f {} \;
                  echo "[$(date -u)] Retention cleanup completed."
              env:
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: lostlink-secrets
                      key: POSTGRES_DB
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: lostlink-secrets
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: lostlink-secrets
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: postgres-storage-postgres-0

