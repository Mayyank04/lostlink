apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lostlink

resources:
  - ../../base
  - backup-cronjob.yaml
  - traefik-middleware.yaml

patches:
  - path: configmap-patch.yaml
  - path: ingress-patch.yaml
  - path: deployment-patch.yaml
  - path: postgres-patch.yaml
  - path: hpa-patch.yaml
  - path: migration-job-patch.yaml

# Pin immutable container image tags for production workloads (avoid 'latest')
images:
  - name: lostlink-web
    newTag: v2.0.0
  - name: lostlink-worker
    newTag: v2.0.0
