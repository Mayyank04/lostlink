apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lostlink

resources:
  - ../../base
  - backup-cronjob.yaml
  - traefik-middleware.yaml

patches:
  - path: configmap-patch.yaml
  - path: ingress-patch.yaml
  - path: deployment-patch.yaml
  - path: postgres-patch.yaml
  - path: hpa-patch.yaml

