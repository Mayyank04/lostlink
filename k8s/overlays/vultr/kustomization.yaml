apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lostlink

resources:
  - ../../base
  - backup-cronjob.yaml
  - backup-storage.yaml
  - traefik-middleware.yaml

patches:
  - path: configmap-patch.yaml
  - path: ingress-patch.yaml
  - path: deployment-patch.yaml
  - path: postgres-patch.yaml
  - path: hpa-patch.yaml
  - path: migration-job-patch.yaml

# Default to the verified VPS images. The release script overrides them for CI releases.
images:
  - name: lostlink-web
    newName: ghcr.io/mayyank04/lostlink-web
    digest: sha256:c7a4e2ecf8b45acd715a46516a8fed3ac3d640b0d93bb3a6d977e7fccbdd2474
  - name: lostlink-worker
    newName: ghcr.io/mayyank04/lostlink-worker
    digest: sha256:b074a96cea352a2ea6c3edcb8eee430508a92590521fe6eb6c9c61dabf206752
