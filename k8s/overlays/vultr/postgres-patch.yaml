apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: lostlink
spec:
  # Scaled to 0 to stop local CrashLoopBackOff when using Vultr Managed PostgreSQL.
  # CRITICAL: PersistentVolumeClaim postgres-storage-postgres-0 and underlying data
  # are fully preserved and must NOT be deleted.
  replicas: 0
