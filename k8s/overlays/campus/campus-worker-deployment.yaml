apiVersion: apps/v1
kind: Deployment
metadata:
  name: lostlink-campus-worker
  namespace: lostlink-campus
  labels:
    app.kubernetes.io/name: lostlink-campus-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lostlink-campus-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lostlink-campus-worker
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: campus-worker
          image: lostlink-campus-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: lostlink-campus-worker-config
            - secretRef:
                name: lostlink-campus-worker-secret
          ports:
            - name: health
              containerPort: 3002
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi

