apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lostlink-ingress
  namespace: lostlink
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  rules:
    - host: staging.lostlink.edu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lostlink-web
                port:
                  number: 3000
