name: LostLink Production Deployment Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Type "DEPLOY" to confirm production release rollout'
        required: true
        default: 'NO'

permissions:
  contents: read
  packages: write

jobs:
  preflight-audit:
    name: Production Preflight Quality & Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Validate Confirmation
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_production != 'DEPLOY'
        run: |
          echo "[-] Aborting: Must type 'DEPLOY' in input prompt to trigger production rollout." >&2
          exit 1

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Execute Full Test Suite
        run: npm test

      - name: Validate Production Kustomize Overlay
        run: |
          kubectl kustomize k8s/overlays/production > /dev/null
          echo "[+] Production Kustomize manifests are valid."

  publish-immutable-images:
    name: Build & Push Immutable SHA Tagged Images
    needs: preflight-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Image Tags
        id: meta
        run: |
          IMAGE_WEB="ghcr.io/${{ github.repository }}/lostlink-web"
          IMAGE_CAMPUS="ghcr.io/${{ github.repository }}/lostlink-campus-worker"
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "web_tag=${IMAGE_WEB}:${SHA_SHORT},${IMAGE_WEB}:latest" >> $GITHUB_OUTPUT
          echo "campus_tag=${IMAGE_CAMPUS}:${SHA_SHORT},${IMAGE_CAMPUS}:latest" >> $GITHUB_OUTPUT

      - name: Build & Push Production Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.web_tag }}

      - name: Build & Push Production Campus Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.campus-worker
          push: true
          tags: ${{ steps.meta.outputs.campus_tag }}

  deploy-production:
    name: Zero-Downtime Rollout to Public Cloud Kubernetes
    needs: publish-immutable-images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Kubeconfig
        if: env.KUBECONFIG_DATA != ''
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
        run: |
          mkdir -p ~/.kube
          echo "${KUBECONFIG_DATA}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy Production Manifests & Verify Health
        if: env.KUBECONFIG_DATA != ''
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
        run: |
          echo "[1/4] Applying production overlay..."
          kubectl apply -k k8s/overlays/production
          
          echo "[2/4] Waiting for Web rollout..."
          if ! kubectl rollout status deployment/lostlink-web -n lostlink --timeout=180s; then
            echo "[-] Rollout failed! Initiating rollback..."
            kubectl rollout undo deployment/lostlink-web -n lostlink
            exit 1
          fi

          echo "[3/4] Waiting for Worker rollout..."
          kubectl rollout status deployment/lostlink-worker -n lostlink --timeout=120s

          echo "[4/4] Automated Smoke Test..."
          WEB_POD=$(kubectl get pod -n lostlink -l app=lostlink-web -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n lostlink "${WEB_POD}" -- curl -sf http://localhost:3000/api/health/ready
          echo "[+] Production deployment successful and ready!"
