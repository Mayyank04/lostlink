name: LostLink Staging CI/CD Pipeline

on:
  push:
    branches: [develop, 'phase-*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test-and-validate:
    name: Run Unit Tests & Schema Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run Vitest Test Suite
        run: npm test

      - name: Validate Kubernetes Kustomize Overlays
        run: |
          kubectl kustomize k8s/overlays/local > /dev/null
          kubectl kustomize k8s/overlays/staging > /dev/null
          kubectl kustomize k8s/overlays/production > /dev/null
          kubectl kustomize k8s/overlays/campus > /dev/null
          echo "All Kustomize overlays are valid."

  build-staging-containers:
    name: Build & Push Staging Images
    needs: test-and-validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Web Application Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: ghcr.io/${{ github.repository }}/lostlink-web:staging-latest

      - name: Build Campus Worker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.campus-worker
          push: false
          tags: ghcr.io/${{ github.repository }}/lostlink-campus-worker:staging-latest
