name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'phase-*'
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssl ca-certificates

      - name: Install Node Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Static Lint Check
        run: npm run lint

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Run Automated Test Suite
        run: npm test

      - name: Build Next.js Production Standalone Bundle
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: "postgresql://lostlink:lostlink@localhost:5432/lostlink?schema=public"
          NEXTAUTH_SECRET: "ci-validation-dummy-secret-key-32chars"
          NEXTAUTH_URL: "http://localhost:3000"
        run: npm run build
